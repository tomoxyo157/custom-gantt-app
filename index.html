<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1 year / zen minimalist</title>

    <!-- EB Garamond Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            font-family: 'EB Garamond', serif !important;
            text-transform: lowercase !important;
            margin: 0;
            padding: 0;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease, opacity 0.3s ease, transform 0.3s ease;
        }

        :root {
            --bg-color: #f4f1ea;
            --card-bg: #fbfbf9;
            --border-color: #e3ded4;
            --text-color: #232220;
            --muted-color: #8c867b;
            --accent-color: #4a453e;
            --line-color: rgba(227, 222, 212, 0.5);
            --sidebar-width: 340px;
            --row-height: 22px; /* Sangat rapat & muat banyak */
            --shadow-md: 0 8px 24px rgba(0,0,0,0.06);
        }

        body.dark-mode {
            --bg-color: #141413;
            --card-bg: #1c1c1a;
            --border-color: #2a2a27;
            --text-color: #e3ded8;
            --muted-color: #737068;
            --accent-color: #b5b0a4;
            --line-color: rgba(42, 42, 39, 0.6);
            --shadow-md: 0 8px 24px rgba(0,0,0,0.5);
        }

        /* Grainy Abstract Overlay */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.035'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 999;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 40px 60px;
        }

        header {
            background: var(--card-bg);
            padding: 10px 20px;
            border: 1px solid var(--border-color);
            border-bottom: none;
            border-radius: 12px 12px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 { font-size: 0.9rem; font-weight: 500; color: var(--text-color); letter-spacing: 0.5px; }

        .theme-switch {
            position: relative;
            width: 28px;
            height: 14px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            padding: 1px;
        }

        .theme-switch-handle {
            width: 10px;
            height: 10px;
            background: var(--text-color);
            border-radius: 50%;
            transform: translateX(0);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        body.dark-mode .theme-switch-handle {
            transform: translateX(14px);
        }

        .gantt-wrapper {
            display: flex;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            flex: 1;
            border-radius: 0 0 12px 12px;
            box-shadow: var(--shadow-md);
            overflow: hidden;
        }

        .gantt-container { display: flex; flex: 1; overflow: hidden; user-select: none; }

        /* Sidebar Panel */
        .gantt-sidebar { width: var(--sidebar-width); background: var(--card-bg); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; z-index: 10; position: relative; }
        .sidebar-header { height: 45px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; padding: 0 16px; }
        .sidebar-body { flex: 1; overflow-y: auto; position: relative; padding: 4px 0; scrollbar-width: none; }
        .sidebar-body::-webkit-scrollbar { display: none; }

        .task-row-container { position: relative; }
        
        .insert-trigger { height: 4px; position: absolute; left: 0; right: 0; z-index: 5; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .insert-trigger.top { top: -2px; }
        .insert-trigger.bottom { bottom: -2px; }
        .insert-line { width: 100%; height: 1px; background: var(--accent-color); opacity: 0; transition: opacity 0.2s; position: relative; }
        .insert-trigger:hover .insert-line { opacity: 0.4; }
        .plus-btn { position: absolute; background: var(--text-color); color: var(--bg-color); border: none; width: 12px; height: 12px; border-radius: 50%; font-size: 0.55rem; display: flex; align-items: center; justify-content: center; cursor: pointer; opacity: 0; transition: opacity 0.2s; top: -6px; left: 50%; transform: translateX(-50%); }
        .insert-trigger:hover .plus-btn { opacity: 1; }

        .task-row { height: var(--row-height); display: flex; align-items: center; border-bottom: 1px solid var(--border-color); padding-right: 8px; background: var(--card-bg); transition: background 0.15s; }
        .task-row.drag-over { background: var(--border-color); border-bottom: 1px dashed var(--accent-color); }

        /* 6 dots digeser agak ke kanan agar ada jarak dari tepian window/page */
        .task-content-inner { display: flex; align-items: center; width: 100%; gap: 5px; position: relative; z-index: 2; padding-left: 10px; }
        
        .drag-handle { cursor: grab; color: var(--muted-color); font-size: 0.75rem; padding: 0 2px; opacity: 0.4; }
        .drag-handle:hover { opacity: 1; }
        .drag-handle:active { cursor: grabbing; }

        .task-name-text { flex: 1; font-size: 0.7rem; color: var(--text-color); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 1px 3px; border-radius: 3px; outline: none; }
        .task-name-text:focus { background: var(--bg-color); border: 1px solid var(--border-color); }
        
        .task-actions { display: flex; gap: 3px; opacity: 0; transition: opacity 0.2s; }
        .task-row:hover .task-actions { opacity: 1; }
        .action-btn { background: none; border: none; padding: 1px 3px; border-radius: 3px; font-size: 0.55rem; cursor: pointer; color: var(--muted-color); }
        .action-btn:hover { background: var(--border-color); color: var(--text-color); }
        .action-btn.del:hover { color: #ff3b30; }

        /* Timeline Panel */
        .gantt-timeline { flex: 1; overflow-x: auto; overflow-y: auto; background: var(--card-bg); position: relative; scrollbar-width: none; }
        .gantt-timeline::-webkit-scrollbar { display: none; }
        
        .timeline-grid-header { display: flex; flex-direction: column; }
        
        .years-row { display: flex; height: 18px; border-bottom: 1px solid var(--border-color); background: var(--bg-color); }
        .year-cell { display: flex; align-items: center; justify-content: center; font-size: 0.65rem; font-weight: 600; color: var(--text-color); border-right: 1px solid var(--border-color); }

        .months-row, .weeks-row { display: flex; height: 16px; border-bottom: 1px solid var(--border-color); }
        .month-cell { border-right: 1px solid var(--border-color); display: flex; align-items: center; justify-content: center; font-size: 0.6rem; color: var(--muted-color); }
        .week-cell { width: 22px; min-width: 22px; border-right: 1px solid var(--border-color); display: flex; align-items: center; justify-content: center; font-size: 0.5rem; color: var(--muted-color); opacity: 0.6; }

        .timeline-rows-container { position: relative; }
        .timeline-row-lane { height: var(--row-height); border-bottom: 1px solid var(--border-color); position: relative; display: flex; align-items: center; }

        .grid-bg-line { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--line-color); pointer-events: none; }

        /* Timeline Bar & Handles */
        .task-bar { position: absolute; height: 12px; background: var(--text-color); border-radius: 2px; display: flex; align-items: center; color: var(--bg-color); font-size: 0.5rem; }
        .task-bar.parent { background: var(--muted-color); font-weight: 600; }
        
        .bar-content { flex: 1; padding: 0 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: move; }
        .task-bar.parent .bar-content { cursor: default; }

        .resizer { width: 5px; height: 100%; position: absolute; top: 0; cursor: col-resize; z-index: 2; opacity: 0; transition: opacity 0.2s; }
        .task-bar:hover .resizer { opacity: 1; background: rgba(255,255,255,0.25); }
        .resizer.left { left: 0; border-radius: 2px 0 0 2px; }
        .resizer.right { right: 0; border-radius: 0 2px 2px 0; }
        
        .current-week-line { position: absolute; top: 0; bottom: 0; width: 1px; background: #ff3b30; z-index: 5; pointer-events: none; }

        /* Zen Animated Modal */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.35); backdrop-filter: blur(2px); display: none; align-items: center; justify-content: center; z-index: 10000; opacity: 0; transition: opacity 0.25s ease; }
        .modal-overlay.active { display: flex; opacity: 1; }
        .modal-card { background: var(--card-bg); padding: 16px; border-radius: 10px; width: 300px; border: 1px solid var(--border-color); box-shadow: var(--shadow-md); transform: scale(0.95); transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .modal-overlay.active .modal-card { transform: scale(1); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; border-bottom: 1px solid var(--border-color); padding-bottom: 6px; }
        .modal-title { font-size: 0.75rem; font-weight: 600; color: var(--text-color); }
        .btn-close { background: none; border: none; font-size: 0.9rem; color: var(--muted-color); cursor: pointer; }
        .modal textarea { width: 100%; height: 70px; padding: 6px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-color); border-radius: 5px; resize: none; margin-bottom: 10px; outline: none; font-size: 0.7rem; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 5px; }
        .btn { background: var(--text-color); color: var(--bg-color); border: none; padding: 3px 8px; border-radius: 5px; cursor: pointer; font-size: 0.65rem; }
        .btn-secondary { background: transparent; color: var(--muted-color); border: 1px solid var(--border-color); }
        .btn-secondary:hover { color: var(--text-color); background: var(--border-color); }
    </style>
</head>
<body class="dark-mode">

    <header>
        <h1>1 year</h1>
        <div class="theme-switch" onclick="toggleTheme()" title="toggle theme">
            <div class="theme-switch-handle" id="switchHandle"></div>
        </div>
    </header>

    <div class="gantt-wrapper">
        <div class="gantt-container">
            <!-- Sidebar Kiri Tanpa Garis Vertikal -->
            <div class="gantt-sidebar" id="sidebarContainer">
                <div class="sidebar-header"></div>
                <div class="sidebar-body" id="sidebarBody"></div>
            </div>

            <!-- Timeline Kanan -->
            <div class="gantt-timeline" id="timelineContainer">
                <div class="timeline-grid-header" id="timelineGridHeader">
                    <div class="years-row" id="yearsRow"></div>
                    <div class="months-row" id="monthsRow"></div>
                    <div class="weeks-row" id="weeksRow"></div>
                </div>
                <div class="timeline-rows-container" id="timelineRowsContainer"></div>
            </div>
        </div>
    </div>

    <!-- Modal Zen Notes -->
    <div class="modal-overlay" id="notesModal" onclick="closeModalOnOverlay(event)">
        <div class="modal-card">
            <div class="modal-header">
                <span class="modal-title" id="modalTitle">catatan</span>
                <button class="btn-close" onclick="closeModal()">×</button>
            </div>
            <textarea id="modalTextarea" placeholder="tulis catatan..."></textarea>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeModal()">batal</button>
                <button class="btn" onclick="saveNotes()">simpan</button>
            </div>
        </div>
    </div>

    <script>
        let timelineConfig = {
            startYear: 2026,
            yearsCount: 1
        };

        let tasks = [
            { id: 1, name: "perencanaan strategis", level: 0, startWeek: 1, endWeek: 4, notes: "kick-off awal tahun." },
            { id: 2, name: "riset pasar & target", level: 1, startWeek: 1, endWeek: 2, notes: "" },
            { id: 3, name: "pengembangan inti sistem", level: 0, startWeek: 5, endWeek: 20, notes: "" }
        ];

        const weekWidth = 22; 
        let draggedTaskIndex = null;
        let currentEditingIndex = null;
        let activeBar = null, actionType = null, startMouseX = 0, initialStartWeek = 0, initialEndWeek = 0;

        function getWeeksInYear(year) {
            const d = new Date(year, 11, 31);
            return (d.getDay() === 4 || (d.getDay() === 3 && ((year % 4 === 0 && year % 100 !== 0) || year % 400 === 0))) ? 53 : 52;
        }

        function initGantt() {
            renderHeader();
            renderContent();
            document.getElementById('timelineContainer').scrollLeft = (32 - 4) * weekWidth;
        }

        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
        }

        function renderHeader() {
            let totalWeeks = 0;
            let yearsHTML = '';
            let monthHTML = '';
            let weekHTML = '';

            for (let y = 0; y < timelineConfig.yearsCount; y++) {
                const yr = timelineConfig.startYear + y;
                const wCount = getWeeksInYear(yr);
                totalWeeks += wCount;
                yearsHTML += `<div class="year-cell" style="width: ${wCount * weekWidth}px;">${yr}</div>`;

                const monthsData = [
                    {n:"jan",w:4}, {n:"feb",w:4}, {n:"mar",w:wCount === 53 ? 5 : 4}, 
                    {n:"apr",w:4}, {n:"mei",w:4}, {n:"jun",w:5}, 
                    {n:"jul",w:4}, {n:"ags",w:4}, {n:"sep",w:5}, 
                    {n:"okt",w:4}, {n:"nov",w:4}, {n:"des",w:wCount === 53 ? 5 : 4}
                ];

                monthsData.forEach(m => {
                    monthHTML += `<div class="month-cell" style="width: ${m.w * weekWidth}px;">${m.n}</div>`;
                });
            }

            for (let i = 1; i <= totalWeeks; i++) {
                weekHTML += `<div class="week-cell">${i}</div>`;
            }

            const totalWidth = totalWeeks * weekWidth;
            document.getElementById('timelineGridHeader').style.width = totalWidth + 'px';
            document.getElementById('timelineRowsContainer').style.width = totalWidth + 'px';

            document.getElementById('yearsRow').innerHTML = yearsHTML;
            document.getElementById('monthsRow').innerHTML = monthHTML;
            document.getElementById('weeksRow').innerHTML = weekHTML;
        }

        function renderContent() {
            updateParentTimelines();
            const sidebar = document.getElementById('sidebarBody');
            const timeline = document.getElementById('timelineRowsContainer');
            
            let sidebarHTML = '';
            let timelineHTML = '';

            tasks.forEach((task, index) => {
                const indent = Math.min(task.level, 6) * 14;
                const isPar = isParent(index);

                sidebarHTML += `
                    <div class="task-row-container">
                        <div class="insert-trigger top" onclick="insertTaskAt(${index})">
                            <div class="insert-line"><button class="plus-btn">+</button></div>
                        </div>
                        <div class="task-row" draggable="true" ondragstart="dragStart(event, ${index})" ondragover="dragOver(event)" ondrop="drop(event, ${index})" ondragleave="dragLeave(event)">
                            <div class="task-content-inner" style="padding-left: ${10 + indent}px;">
                                <span class="drag-handle" title="geser hierarki / posisi">⠿</span>
                                <span class="task-name-text" contenteditable="true" onblur="updateTaskNameInline(${index}, this.innerText)">${task.name}</span>
                                <div class="task-actions">
                                    <button class="action-btn" onclick="openNotes(${index})" title="catatan">catatan</button>
                                    <button class="action-btn del" onclick="deleteTask(${index})" title="hapus">hapus</button>
                                </div>
                            </div>
                        </div>
                        ${index === tasks.length - 1 ? `
                        <div class="insert-trigger bottom" onclick="insertTaskAt(${index + 1})">
                            <div class="insert-line"><button class="plus-btn">+</button></div>
                        </div>` : ''}
                    </div>
                `;

                const leftPos = (task.startWeek - 1) * weekWidth;
                const widthBar = Math.max(1, (task.endWeek - task.startWeek + 1)) * weekWidth;
                let handles = !isPar ? `<div class="resizer left" onmousedown="initAction(event, ${index}, 'resize-left')"></div><div class="resizer right" onmousedown="initAction(event, ${index}, 'resize-right')"></div>` : '';
                let moveEvent = !isPar ? `onmousedown="initAction(event, ${index}, 'move')"` : '';

                let totalWeeks = getWeeksInYear(timelineConfig.startYear);
                let gridLines = '';
                for(let w = 1; w <= totalWeeks; w++) {
                    gridLines += `<div class="grid-bg-line" style="left: ${(w - 1) * weekWidth}px;"></div>`;
                }

                timelineHTML += `
                    <div class="timeline-row-lane">
                        ${gridLines}
                        <div class="task-bar ${isPar ? 'parent' : ''}" style="left: ${leftPos}px; width: ${widthBar}px;">
                            ${handles}
                            <div class="bar-content" ${moveEvent}>${task.name}</div>
                        </div>
                    </div>
                `;
            });

            timelineHTML += `<div class="current-week-line" style="left: ${(31 - 1) * weekWidth}px;"></div>`;
            
            sidebar.innerHTML = sidebarHTML;
            timeline.innerHTML = timelineHTML;
        }

        function insertTaskAt(index) {
            const newId = tasks.length > 0 ? Math.max(...tasks.map(t => t.id)) + 1 : 1;
            tasks.splice(index, 0, { id: newId, name: "tugas baru", level: 0, startWeek: 1, endWeek: 4, notes: "" });
            renderContent();
        }

        function updateTaskNameInline(index, newName) {
            if (newName.trim() !== "") {
                tasks[index].name = newName.trim();
                const bars = document.querySelectorAll('.bar-content');
                if (bars[index]) bars[index].innerText = newName.trim();
            }
        }

        function openNotes(index) {
            currentEditingIndex = index;
            document.getElementById('modalTitle').innerText = `catatan: ${tasks[index].name}`;
            document.getElementById('modalTextarea').value = tasks[index].notes || "";
            document.getElementById('notesModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('notesModal').classList.remove('active');
            currentEditingIndex = null;
        }

        function closeModalOnOverlay(e) {
            if (e.target.id === 'notesModal') closeModal();
        }

        function saveNotes() {
            if (currentEditingIndex !== null) {
                tasks[currentEditingIndex].notes = document.getElementById('modalTextarea').value;
            }
            closeModal();
        }

        function deleteTask(index) {
            tasks.splice(index, 1);
            renderContent();
        }

        function dragStart(e, index) { draggedTaskIndex = index; e.dataTransfer.effectAllowed = 'move'; }
        function dragOver(e) { e.preventDefault(); e.currentTarget.classList.add('drag-over'); }
        function dragLeave(e) { e.currentTarget.classList.remove('drag-over'); }
        
        function drop(e, targetIndex) {
            e.preventDefault();
            e.currentTarget.classList.remove('drag-over');
            if (draggedTaskIndex === null) return;

            const sidebarEl = document.getElementById('sidebarContainer');
            const sidebarRect = sidebarEl.getBoundingClientRect();
            
            let relativeX = e.clientX - sidebarRect.left;
            let targetLevel = Math.floor(relativeX / 14);
            
            if (targetIndex > 0) {
                let checkIdx = targetIndex > draggedTaskIndex ? targetIndex : targetIndex - 1;
                let maxAllowedLevel = tasks[checkIdx].level + 1;
                targetLevel = Math.min(targetLevel, maxAllowedLevel);
            } else {
                targetLevel = 0;
            }
            
            targetLevel = Math.max(0, Math.min(targetLevel, 6));

            const task = tasks.splice(draggedTaskIndex, 1)[0];
            task.level = targetLevel;
            tasks.splice(targetIndex, 0, task);
            
            renderContent();
            draggedTaskIndex = null;
        }

        function initAction(e, index, action) {
            e.preventDefault();
            activeBar = index; actionType = action; startMouseX = e.clientX;
            initialStartWeek = tasks[index].startWeek; initialEndWeek = tasks[index].endWeek;
            
            document.addEventListener('mousemove', handleMouseMove);
            document.addEventListener('mouseup', stopAction);
        }

        function handleMouseMove(e) {
            if (activeBar === null) return;
            const weekShift = Math.round((e.clientX - startMouseX) / weekWidth);
            let task = tasks[activeBar];
            const maxWeeks = getWeeksInYear(timelineConfig.startYear);

            if (actionType === 'move') {
                const dur = initialEndWeek - initialStartWeek;
                let ns = initialStartWeek + weekShift;
                if (ns < 1) ns = 1; if (ns + dur > maxWeeks) ns = maxWeeks - dur;
                task.startWeek = ns; task.endWeek = ns + dur;
            } else if (actionType === 'resize-left') {
                let ns = initialStartWeek + weekShift;
                if (ns < 1) ns = 1; if (ns > task.endWeek) ns = task.endWeek;
                task.startWeek = ns;
            } else if (actionType === 'resize-right') {
                let ne = initialEndWeek + weekShift;
                if (ne > maxWeeks) ne = maxWeeks; if (ne < task.startWeek) ne = task.startWeek;
                task.endWeek = ne;
            }
            renderContent();
        }

        function stopAction() { 
            activeBar = null; 
            actionType = null; 
            document.removeEventListener('mousemove', handleMouseMove); 
            document.removeEventListener('mouseup', stopAction); 
        }

        function isParent(index) {
            if (index >= tasks.length - 1) return false;
            return tasks[index + 1].level > tasks[index].level;
        }

        function updateParentTimelines() {
            for (let i = 0; i < tasks.length; i++) {
                let curLvl = tasks[i].level;
                let children = [], j = i + 1;
                while (j < tasks.length && tasks[j].level > curLvl) { children.push(tasks[j]); j++; }
                if (children.length > 0) {
                    tasks[i].startWeek = Math.min(...children.map(c => c.startWeek));
                    tasks[i].endWeek = Math.max(...children.map(c => c.endWeek));
                }
            }
        }

        window.onload = initGantt;
    </script>
</body>
</html>
